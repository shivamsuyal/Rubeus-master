name: Build and Release Rubeus

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore Packages
        run: nuget restore Rubeus.sln

      - name: Build
        run: msbuild Rubeus.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Create Release Folder
        run: |
          mkdir release
          copy Rubeus\bin\Release\Rubeus.exe release\Rubeus.exe

      - name: Generate Tag
        id: tag
        shell: pwsh
        run: |
          $tag = "build-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Rubeus Build ${{ steps.tag.outputs.tag }}
          files: release/Rubeus.exe