name: Build Rubeus

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore Packages
        run: nuget restore Rubeus.sln

      - name: Build Release
        run: msbuild Rubeus.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: Rubeus-Build
          path: |
            **/bin/Release/*.exe
            **/bin/Release/*.dll